name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (CPU-only torch keeps CI fast)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  demo-image:
    name: Demo Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.demo
        run: docker build -f Dockerfile.demo -t remotehunt-demo .
      - name: Smoke test
        run: |
          docker run -d --name demo -p 8000:8000 remotehunt-demo
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/api/dashboard | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['resume'] and d['top_jobs'], d; print('demo ok:', len(d['top_jobs']), 'top jobs')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/search/run -H 'Content-Type: application/json' -d '{}')" = 403
          docker logs demo | tail -5
