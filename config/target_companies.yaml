# Companies whose public ATS job boards are polled directly (official public job-board APIs).
# Find a board token from the company's careers URL:
#   greenhouse       -> boards.greenhouse.io/<token>  or  job-boards.greenhouse.io/<token>
#   lever            -> jobs.lever.co/<token>
#   ashby            -> jobs.ashbyhq.com/<token>
#   workable         -> apply.workable.com/<token>
#   smartrecruiters  -> jobs.smartrecruiters.com/<CompanyIdentifier>
# A wrong token is logged as a health failure for that company and skipped - it never crashes a run.
# All tokens below were verified to resolve on 2026-09-28.

