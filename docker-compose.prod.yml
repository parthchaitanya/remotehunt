# Production: HTTPS via Caddy (automatic Let's Encrypt), login required, only ports 80/443 exposed.
#   Requires in .env:  DOMAIN=yourname.duckdns.org   APP_PASSWORD=<long password>   FERNET_KEY=...
#   Start:  docker compose -f docker-compose.prod.yml up -d --build
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: [.env]
    environment:
      DATA_DIR: /app/data
      CONFIG_DIR: /app/config
      FRONTEND_URL: https://${DOMAIN:?set DOMAIN in .env}
      CORS_ORIGINS: https://${DOMAIN}
      OAUTH_REDIRECT_URI: https://${DOMAIN}/api/gmail/auth/callback
      TZ: Asia/Kolkata
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - hf-cache:/app/.hf-cache
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend]
    restart: unless-stopped

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
